name: Baseline (Slow) Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-all-in-one:
    name: Terraform (Sequential - No Cache)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.1

      # Anti-pattern: no caching — downloads providers every run
      - name: Terraform Init
        run: terraform init -backend=false

      # Anti-pattern: sequential steps that could run in parallel
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      #add temporary Verify AWS secrets
      - name: Terraform Validate
        run: terraform validate

      - name: Verify AWS secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "AWS_ACCESS_KEY_ID is missing"
            exit 1
          else
            echo "AWS_ACCESS_KEY_ID is available"
          fi

          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "AWS_SECRET_ACCESS_KEY is missing"
            exit 1
          else
            echo "AWS_SECRET_ACCESS_KEY is available"
          fi

      - name: Terraform Plan
        run: terraform plan -no-color -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
